name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r tests/requirements.txt
      - name: Unit tests TypeScript
        run: npx tsx --test tests/unit/domain.test.ts
      - name: Unit tests pytest
        run: pytest tests/unit tests/acceptance -q
      - name: Quality metrics
        run: python tests/quality/analyze_quality.py
      - name: Anonymous API and security
        run: pytest tests/api/test_api.py tests/security/test_security.py -q -k "not valid_login and not authenticated_ and not auth_latency"

  e2e:
    runs-on: ubuntu-latest
    needs: unit-api-quality
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright against production
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --config tests/e2e/playwright.config.ts
